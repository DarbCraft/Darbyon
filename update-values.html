<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Values</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body data-teacher-page>
    <nav id="nav" aria-label="Pages"></nav>
    <h1>Update Values</h1>

    <div class="split">
        <div>
            <h2>Select Players</h2>
            <div class="toolbar">
                <button type="button" data-bulk="xp">🏅 XP to Selected</button>
                <button type="button" data-bulk="ap">💎 AP to Selected</button>
                <button type="button" data-bulk="hp">❤️ HP to Selected</button>
                <button type="button" id="undoButton" class="secondary">Undo Last Action</button>
            </div>
            <div class="table-wrap">
                <table id="playerTable">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAllCheckbox" aria-label="Select all players"></th>
                            <th>Update</th>
                            <th class="sortable" data-sort="name" tabindex="0">Name</th>
                            <th class="sortable" data-sort="type" tabindex="0">Type</th>
                            <th class="sortable" data-sort="level" tabindex="0">Level</th>
                            <th class="sortable num" data-sort="xp" tabindex="0">XP</th>
                            <th class="sortable num" data-sort="ap" tabindex="0">AP</th>
                            <th class="sortable num" data-sort="hp" tabindex="0">HP</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <h2>Generate Daily News</h2>
            <div class="panel spotlight">
                <div class="toolbar">
                    <button type="button" id="generateMessageButton">Show Daily News</button>
                    <button type="button" id="resetDailyEventsButton" class="secondary">Reset Daily Events</button>
                </div>
                <p class="big" id="currentMessage" aria-live="polite">Generate Daily News</p>
                <p class="counter">Messages shown: <span id="messageCounter">0/0</span></p>
            </div>
        </div>

        <aside class="panel log" id="changeLog">
            <h2>Change Log</h2>
            <button type="button" id="clearLogButton" class="secondary small">Clear Log</button>
            <div id="logEntries"></div>
        </aside>
    </div>

    <script src="app.js"></script>
    <script src="battle.js"></script>
    <script src="update-values.js"></script>
</body>
</html>
