<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#17264d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DårbCRÅFT">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Powers</title>
    <link rel="icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body data-teacher-page>
    <nav id="nav" aria-label="Pages"></nav>
    <h1>Powers</h1>

    <div class="toolbar">
        <button type="button" id="undoButton" class="secondary">Undo Last Action</button>
    </div>
    <p id="notice" class="notice" role="status"></p>

    <section id="requestsSection" hidden>
        <h2>Students Waiting</h2>
        <div class="panel requests" id="requestsList"></div>
    </section>

    <h2>Player List</h2>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Level</th>
                    <th class="num">XP</th>
                    <th class="num">AP</th>
                    <th class="num">HP</th>
                    <th>Power</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="playersTableBody"></tbody>
        </table>
    </div>

    <h2>Powers List</h2>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Power Name</th>
                    <th>Type</th>
                    <th class="num">AP Cost</th>
                    <th>Effect</th>
                    <th>Effect to Teammate</th>
                </tr>
            </thead>
            <tbody id="powersTableBody"></tbody>
        </table>
    </div>

    <script src="app.js"></script>
    <script src="battle.js"></script>
    <script src="requests.js"></script>
    <script src="powers.js"></script>
</body>
</html>
