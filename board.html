<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-board" data-teacher-page>
    <nav id="nav" aria-label="Pages"></nav>

    <main id="board" class="board">
        <div id="boardWidgets" class="board-widgets"></div>
        <p id="boardEmpty" class="board-empty">Choose a tool from the bar below.</p>
        <div class="board-toolbar" role="toolbar" aria-label="Classroom tools">
            <button type="button" data-widget="timer"><span aria-hidden="true">⏱️</span> Timer</button>
            <button type="button" data-widget="stopwatch"><span aria-hidden="true">⏲️</span> Stopwatch</button>
            <button type="button" data-widget="clock"><span aria-hidden="true">🕒</span> Clock</button>
            <button type="button" data-widget="picker"><span aria-hidden="true">🎲</span> Name Picker</button>
            <button type="button" data-widget="groups"><span aria-hidden="true">👥</span> Groups</button>
            <button type="button" data-widget="noise"><span aria-hidden="true">🔊</span> Noise Meter</button>
            <button type="button" data-widget="poll"><span aria-hidden="true">🗳️</span> Poll</button>
            <button type="button" data-widget="requests"><span aria-hidden="true">✋</span> Requests <span id="requestCount" class="count" hidden></span></button>
            <span class="toolbar-gap"></span>
            <button type="button" id="backgroundButton" class="soft"><span aria-hidden="true">🎨</span> Background</button>
            <button type="button" id="fullscreenButton" class="soft"><span aria-hidden="true">⛶</span> Full Screen</button>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="battle.js"></script>
    <script src="requests.js"></script>
    <script src="board.js"></script>
</body>
</html>
