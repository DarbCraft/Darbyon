<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#17264d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DårbCRÅFT">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Board</title>
    <link rel="icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-board" data-teacher-page>
    <nav id="nav" aria-label="Pages"></nav>

    <main id="board" class="board">
        <div id="boardWidgets" class="board-widgets"></div>
        <p id="boardEmpty" class="board-empty">Choose a tool from the bar below.</p>
        <div class="board-toolbar" role="toolbar" aria-label="Classroom tools">
            <button type="button" data-widget="timer"><span data-icon="timer"></span> Timer</button>
            <button type="button" data-widget="stopwatch"><span data-icon="stopwatch"></span> Stopwatch</button>
            <button type="button" data-widget="clock"><span data-icon="clock"></span> Clock</button>
            <button type="button" data-widget="picker"><span data-icon="dice"></span> Name Picker</button>
            <button type="button" data-widget="groups"><span data-icon="people"></span> Groups</button>
            <button type="button" data-widget="noise"><span data-icon="speaker"></span> Noise Meter</button>
            <button type="button" data-widget="damage"><span data-icon="burst"></span> Damage</button>
            <button type="button" data-widget="poll"><span data-icon="ballot"></span> Poll</button>
            <button type="button" data-widget="requests"><span data-icon="hand"></span> Requests <span id="requestCount" class="count" hidden></span></button>
            <span class="toolbar-gap"></span>
            <button type="button" id="backgroundButton" class="soft"><span data-icon="palette"></span> Background</button>
            <button type="button" id="projectorButton" class="soft" aria-pressed="false"><span data-icon="expand"></span> Projector</button>
            <button type="button" id="fullscreenButton" class="soft"><span data-icon="expand"></span> Full Screen</button>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="wheel.js"></script>
    <script src="battle.js"></script>
    <script src="requests.js"></script>
    <script src="board.js"></script>
</body>
</html>
